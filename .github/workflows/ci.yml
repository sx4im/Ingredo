name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repository. Without this, the workflow's GITHUB_TOKEN
# inherits the repo-wide default, which on many repos is write-all — meaning a
# compromised dependency running during `pnpm install` or a test could push
# commits or publish releases.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      # The published artifact is the build output, not the sources tsc checks.
      # Without this step a tsup/vite build break only surfaces at publish time.
      - run: pnpm build
