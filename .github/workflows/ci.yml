name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repository. Without this, the workflow's GITHUB_TOKEN
# inherits the repo-wide default, which on many repos is write-all — meaning a
# compromised dependency running during `pnpm install` or a test could push
# commits or publish releases.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # Build gates ship-ability: a broken dist must never reach main — the
      # published artifact is the build output, not the sources tsc checks.
      # Also guarantees fresh .d.ts for downstream packages' tsc paths.
      - run: pnpm build

      - run: pnpm test
